spring.application.name=mitu-ai
# Local secrets: put GEMINI_API_KEY=... in a .env file next to the project (git-ignored)
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

# Uploads: PDFs for chat, photos for anime art
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Gemini (free key from https://aistudio.google.com). Never commit the key:
# set the GEMINI_API_KEY environment variable instead.
mitu.gemini.api-key=${GEMINI_API_KEY:}
mitu.gemini.chat-model=${GEMINI_CHAT_MODEL:gemini-3.5-flash,gemini-flash-lite-latest,gemini-flash-latest}
mitu.gemini.embed-model=${GEMINI_EMBED_MODEL:gemini-embedding-001}
mitu.gemini.image-model=${GEMINI_IMAGE_MODEL:gemini-3.1-flash-image,gemini-2.5-flash-image}

# Where MiTu keeps the document index between restarts
mitu.data-dir=${MITU_DATA_DIR:data}

# Max AI requests per visitor per minute (protects the free quota when public)
mitu.rate-limit.per-minute=${MITU_RATE_LIMIT:20}
